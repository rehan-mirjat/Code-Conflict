version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_conflict_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - COOKIE_SECURE=false
      - CC_DB=/app/data/data.db
    volumes:
      - cconflict_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cconflict_data:
    driver: local

